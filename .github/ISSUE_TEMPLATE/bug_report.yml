name: Bug report
description: Something is wrong or the numbers don't look right
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please don't paste raw session files or unredacted prompts here: this tracker is public.
        If redaction missed a secret, report it privately instead (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, what you expected, and what you got.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `said doctor`
      render: text
  - type: input
    id: version
    attributes:
      label: said --version
  - type: dropdown
    id: os
    attributes:
      label: OS
      options: [macOS, Linux, Windows]
